name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer le projet et pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Exécuter les tests
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer Ruff
        run: python -m pip install ruff
      - name: Vérifier le code
        # Bloque les erreurs Python certaines sans imposer d'un coup toute la
        # dette de style historique du projet.
        run: ruff check fastapi_doctor.py modules tests --select E9,F63,F7,F82

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Construire le paquet
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publier le paquet construit
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
