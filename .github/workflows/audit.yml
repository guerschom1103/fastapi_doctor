name: FastAPI Doctor Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install FastAPI Doctor
      run: |
        python -m pip install --upgrade pip
        pip install .[full]
    - name: Run FastAPI Doctor audit
      run: |
        fastapi-doctor --path . --deep --fail-on HIGH --format sarif --output audit.sarif
    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: audit.sarif
    - name: Upload HTML report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: audit-report
        path: audit.html
    - name: Generate HTML report
      run: |
        fastapi-doctor --path . --deep --format html --output audit.html